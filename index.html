<!doctype html>
<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Předpověď počasí</title>
        <link rel="stylesheet" href="/src/styles/main.css" />
    </head>
    <body>
        <div class="app-container">
            <header class="app-header">
                <div class="header-top-row">
                    <h1 class="app-title">
                        <span>🌦️</span>
                        <span id="app-title-text">Předpověď počasí</span>
                    </h1>
                    <div class="language-switcher-wrapper">
                        <select
                            id="language-select"
                            class="language-select"
                            aria-label="Vybrat jazyk">
                            <option value="cs">🇨🇿 Čeština</option>
                            <option value="en">🇬🇧 English</option>
                            <option value="de">🇩🇪 Deutsch</option>
                            <option value="es">🇪🇸 Español</option>
                            <option value="fr">🇫🇷 Français</option>
                        </select>
                    </div>
                </div>
                <p id="app-subtitle-text" class="app-subtitle">
                    Vyhledejte město a zobrazte 5denní předpověď počasí
                </p>
            </header>

            <main class="app-main">
                <section class="search-section" aria-label="Vyhledávání měst">
                    <label for="city-search-input" class="search-label">
                        Vyberte město
                    </label>
                    <div class="search-bar-row">
                        <div class="autocomplete-wrapper">
                            <input
                                type="text"
                                id="city-search-input"
                                class="search-input"
                                placeholder="Hledat město (např. Praha, Londýn)..."
                                autocomplete="off"
                                spellcheck="false"
                                disabled />
                            <button
                                type="button"
                                id="city-search-clear-button"
                                class="search-clear-button"
                                aria-label="Vymazat vyhledávání"
                                title="Vymazat vyhledávání"
                                hidden>
                                &times;
                            </button>
                            <div
                                id="city-autocomplete-dropdown"
                                class="autocomplete-dropdown"
                                hidden></div>
                        </div>

                        <button
                            type="button"
                            id="geolocation-button"
                            class="geolocation-button"
                            aria-label="Použít aktuální polohu"
                            title="Zjistit a použít moji aktuální polohu">
                            <span class="geolocation-icon" aria-hidden="true">
                                📍
                            </span>
                            <span class="geolocation-label">Moje poloha</span>
                        </button>
                    </div>
                </section>

                <section
                    id="forecast-container"
                    class="forecast-section"
                    aria-live="polite">
                    <!-- Forecast states (initial prompt, loading, table, error) dynamically rendered here -->
                </section>
            </main>

            <footer class="app-footer">
                <p>
                    Aplikace pro předpověď počasí &bull; Vytvořil Libor Šaja
                    &bull; Poháněno OpenWeather API
                </p>
            </footer>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
